<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1072" viewBox="0 0 1500 1072">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0d12"/>
      <stop offset="1" stop-color="#182032"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)"/>
  <rect x="36" y="34" width="1428" height="1004" rx="24" fill="#151b29" stroke="#2e3a50" filter="url(#shadow)"/>
  <rect x="36" y="34" width="1428" height="58" rx="24" fill="#252c3b"/>
  <circle cx="68" cy="63" r="9" fill="#ff5f57"/>
  <circle cx="96" cy="63" r="9" fill="#febc2e"/>
  <circle cx="124" cy="63" r="9" fill="#28c840"/>
  <text x="158" y="70" fill="#eef2ff" font-family="Menlo, Consolas, monospace" font-size="22" font-weight="700">Mission 10 - Migration des documents fabricant</text>
  <text x="70" y="140" fill="#f4c15d" font-family="Menlo, Consolas, monospace" font-size="38" font-weight="700">Mission 10 - Migration des documents fabricant</text>
  <text x="70" y="184" fill="#9aa6bd" font-family="Menlo, Consolas, monospace" font-size="22">Note README du 11/08/2026 - Odoo 12 vers Odoo 19 local</text>
  <rect x="70" y="204" width="1360" height="172" rx="16" fill="#101520" stroke="#2c3850"/>
  <text x="98" y="240" fill="#86d8ff" font-family="Menlo, Consolas, monospace" font-size="26" font-weight="700">Objectif</text>
  <text x="98" y="282" fill="#c8d0e0" font-family="Menlo, Consolas, monospace" font-size="21">- Migrer la documentation fabricant des produits vers Odoo 19.</text>
  <text x="98" y="316" fill="#c8d0e0" font-family="Menlo, Consolas, monospace" font-size="21">- Source Odoo 12 : product_template.documents et documents_name.</text>
  <text x="98" y="350" fill="#c8d0e0" font-family="Menlo, Consolas, monospace" font-size="21">- Destination : champ Document d&#x27;utilisation du module product_manufacturer.</text>
  <rect x="70" y="404" width="1360" height="206" rx="16" fill="#101520" stroke="#2c3850"/>
  <text x="98" y="440" fill="#86d8ff" font-family="Menlo, Consolas, monospace" font-size="26" font-weight="700">Workflow n8n</text>
  <text x="98" y="482" fill="#2ee59d" font-family="Menlo, Consolas, monospace" font-size="21">$ product_manufacturer_documents</text>
  <text x="98" y="516" fill="#c8d0e0" font-family="Menlo, Consolas, monospace" font-size="21">- Workflow principal lance une seule fois pour reprendre la migration.</text>
  <text x="98" y="550" fill="#c8d0e0" font-family="Menlo, Consolas, monospace" font-size="21">- Boucle visuelle : Executer un lot de 30 puis Next Cursor.</text>
  <text x="98" y="584" fill="#c8d0e0" font-family="Menlo, Consolas, monospace" font-size="21">- Sous-workflow publie : product_manufacturer_documents_batch.</text>
  <rect x="70" y="638" width="1360" height="240" rx="16" fill="#101520" stroke="#2c3850"/>
  <text x="98" y="674" fill="#86d8ff" font-family="Menlo, Consolas, monospace" font-size="26" font-weight="700">Suivi technique</text>
  <text x="98" y="716" fill="#f4c15d" font-family="Menlo, Consolas, monospace" font-size="21">Mapping produits : mig_map_product_template</text>
  <text x="98" y="750" fill="#f4c15d" font-family="Menlo, Consolas, monospace" font-size="21">Suivi documents : mig_map_product_document</text>
  <text x="98" y="784" fill="#f4c15d" font-family="Menlo, Consolas, monospace" font-size="21">Etat de reprise : mig_state_product_document</text>
  <text x="98" y="818" fill="#c8d0e0" font-family="Menlo, Consolas, monospace" font-size="21">- Relance possible sans doublon.</text>
  <text x="98" y="852" fill="#c8d0e0" font-family="Menlo, Consolas, monospace" font-size="21">- Verrou de lot et index unique pour eviter les pieces jointes doubles.</text>
  <rect x="70" y="906" width="1360" height="240" rx="16" fill="#101520" stroke="#2c3850"/>
  <text x="98" y="942" fill="#86d8ff" font-family="Menlo, Consolas, monospace" font-size="26" font-weight="700">Resultat du test local</text>
  <text x="98" y="984" fill="#f4c15d" font-family="Menlo, Consolas, monospace" font-size="21">Date : 11/08/2026</text>
  <text x="98" y="1018" fill="#eef2ff" font-family="Menlo, Consolas, monospace" font-size="21">2708 documents migres</text>
  <text x="98" y="1052" fill="#eef2ff" font-family="Menlo, Consolas, monospace" font-size="21">0 ignore</text>
  <text x="98" y="1086" fill="#eef2ff" font-family="Menlo, Consolas, monospace" font-size="21">0 doublon</text>
  <text x="98" y="1120" fill="#eef2ff" font-family="Menlo, Consolas, monospace" font-size="21">5416 pieces jointes valides au total</text>
</svg>
