<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1140" viewBox="0 0 1500 1140">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0d12"/>
      <stop offset="1" stop-color="#182032"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)"/>
  <rect x="36" y="34" width="1428" height="1072" rx="24" fill="#151b29" stroke="#2e3a50" filter="url(#shadow)"/>
  <rect x="36" y="34" width="1428" height="58" rx="24" fill="#252c3b"/>
  <circle cx="68" cy="63" r="9" fill="#ff5f57"/>
  <circle cx="96" cy="63" r="9" fill="#febc2e"/>
  <circle cx="124" cy="63" r="9" fill="#28c840"/>
  <text x="158" y="70" fill="#eef2ff" font-family="Menlo, Consolas, monospace" font-size="22" font-weight="700">Mission 11 - Modules Odoo 19 de suivi et acompte</text>
  <text x="70" y="140" fill="#f4c15d" font-family="Menlo, Consolas, monospace" font-size="38" font-weight="700">Mission 11 - Modules Odoo 19 de suivi et acompte</text>
  <text x="70" y="184" fill="#9aa6bd" font-family="Menlo, Consolas, monospace" font-size="22">Note README du 13/08/2026 - modules detailed_chatter et sale_down_payment_deduction</text>
  <rect x="70" y="204" width="1360" height="274" rx="16" fill="#101520" stroke="#2c3850"/>
  <text x="98" y="240" fill="#86d8ff" font-family="Menlo, Consolas, monospace" font-size="26" font-weight="700">Module detailed_chatter</text>
  <text x="98" y="282" fill="#2ee59d" font-family="Menlo, Consolas, monospace" font-size="21">$ addons19/detailed_chatter</text>
  <text x="98" y="316" fill="#f4c15d" font-family="Menlo, Consolas, monospace" font-size="21">Nom : Historique detaille</text>
  <text x="98" y="350" fill="#f4c15d" font-family="Menlo, Consolas, monospace" font-size="21">Version : 19.0.1.3.1</text>
  <text x="98" y="384" fill="#f4c15d" font-family="Menlo, Consolas, monospace" font-size="21">Dependances : sale_management, account, tr_fancy_reports</text>
  <text x="98" y="418" fill="#c8d0e0" font-family="Menlo, Consolas, monospace" font-size="21">- Ajoute des notes internes dans le chatter.</text>
  <text x="98" y="452" fill="#c8d0e0" font-family="Menlo, Consolas, monospace" font-size="21">- Suit les modifications sur devis, factures clients et produits.</text>
  <rect x="70" y="506" width="1360" height="206" rx="16" fill="#101520" stroke="#2c3850"/>
  <text x="98" y="542" fill="#86d8ff" font-family="Menlo, Consolas, monospace" font-size="26" font-weight="700">Elements suivis</text>
  <text x="98" y="584" fill="#c8d0e0" font-family="Menlo, Consolas, monospace" font-size="21">- Lignes ajoutees, modifiees ou supprimees.</text>
  <text x="98" y="618" fill="#c8d0e0" font-family="Menlo, Consolas, monospace" font-size="21">- Produit, description, quantite, unite, prix, remise et taxes.</text>
  <text x="98" y="652" fill="#c8d0e0" font-family="Menlo, Consolas, monospace" font-size="21">- Adresse de facturation/livraison, dates, references et paiement.</text>
  <text x="98" y="686" fill="#c8d0e0" font-family="Menlo, Consolas, monospace" font-size="21">- Produit : categorie, prix, cout, taxes, fabricant, document, marge, image.</text>
  <rect x="70" y="740" width="1360" height="240" rx="16" fill="#101520" stroke="#2c3850"/>
  <text x="98" y="776" fill="#86d8ff" font-family="Menlo, Consolas, monospace" font-size="26" font-weight="700">Module sale_down_payment_deduction</text>
  <text x="98" y="818" fill="#2ee59d" font-family="Menlo, Consolas, monospace" font-size="21">$ addons19/sale_down_payment_deduction</text>
  <text x="98" y="852" fill="#f4c15d" font-family="Menlo, Consolas, monospace" font-size="21">Nom : Deduction des acomptes</text>
  <text x="98" y="886" fill="#f4c15d" font-family="Menlo, Consolas, monospace" font-size="21">Version : 19.0.1.0.0</text>
  <text x="98" y="920" fill="#f4c15d" font-family="Menlo, Consolas, monospace" font-size="21">Dependance : sale_management</text>
  <text x="98" y="954" fill="#c8d0e0" font-family="Menlo, Consolas, monospace" font-size="21">- Ajoute la case Acompte deduit lors de la facturation d&#x27;un devis.</text>
  <rect x="70" y="1008" width="1360" height="206" rx="16" fill="#101520" stroke="#2c3850"/>
  <text x="98" y="1044" fill="#86d8ff" font-family="Menlo, Consolas, monospace" font-size="26" font-weight="700">Test local</text>
  <text x="98" y="1086" fill="#f4c15d" font-family="Menlo, Consolas, monospace" font-size="21">Date : 13/08/2026</text>
  <text x="98" y="1120" fill="#c8d0e0" font-family="Menlo, Consolas, monospace" font-size="21">- Devis de 100 euros avec acompte de 20 euros.</text>
  <text x="98" y="1154" fill="#c8d0e0" font-family="Menlo, Consolas, monospace" font-size="21">- Case cochee : facture finale de 80 euros.</text>
  <text x="98" y="1188" fill="#c8d0e0" font-family="Menlo, Consolas, monospace" font-size="21">- Case decochee : facture finale de 100 euros.</text>
</svg>
